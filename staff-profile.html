<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#062f1c">
<title>Staff Profile | King Ceasor University</title>
<link rel="stylesheet" href="assets/css/styles.css">
</head>
<body class="inner">
<div id="site-header"></div>
<main id="main">
<section class="page-hero"><div class="wrap"><p class="crumbs"><a href="index.html">Home</a> / <a href="about.html">About</a> / <a href="staff-directory.html">Staff directory</a> / <span id="crumb-name">Profile</span></p><span class="eyebrow">King Ceasor University</span><h1>Staff Profile</h1></div></section>
<section class="section"><div class="wrap" id="profile"></div></section>
</main>
<div id="site-footer"></div>
<script src="assets/js/staff-data.js"></script>
<script>
const id = new URLSearchParams(location.search).get('id');
const idx = STAFF.findIndex(s => s.id === id), s = STAFF[idx];
const box = document.getElementById('profile');
if (!s) {
  box.innerHTML = '<p>Profile not found. <a class="text-link" href="staff-directory.html">Back to the staff directory →</a></p>';
} else {
  document.title = `${s.name} | King Ceasor University`;
  document.getElementById('crumb-name').textContent = s.name;
  const TABS = [['bio', 'Biography'], ['qualifications', 'Qualifications'], ['interests', 'Interests'], ['publications', 'Publications'], ['supervision', 'Supervision'], ['more', 'More']];
  const panel = key => {
    const items = s[key] || [];
    if (!items.length) return '<p class="sp-none">Information not yet added.</p>';
    return key === 'bio' ? items.map(p => `<p>${esc(p)}</p>`).join('') : `<ul class="sp-items">${items.map(i => `<li>${esc(i)}</li>`).join('')}</ul>`;
  };
  const row = (icon, html) => html ? `<li><span class="sp-ico" aria-hidden="true">${icon}</span><span>${html}</span></li>` : '';
  const prev = STAFF[(idx - 1 + STAFF.length) % STAFF.length], next = STAFF[(idx + 1) % STAFF.length];
  box.innerHTML = `<article class="sp">
    <div class="sp-side"><div class="sp-photo">${s.photo ? `<img src="${esc(s.photo)}" alt="${esc(s.name)}">` : initials(s.name)}</div>
      <h2>${esc(s.name)}</h2>
      <ul class="sp-list">
        ${row('🎓', esc(s.title))}
        ${row('✉', s.email ? `<a href="mailto:${esc(s.email)}">${esc(s.email)}</a>` : '')}
        ${row('☎', s.phone ? `<a href="tel:${esc(s.phone.replace(/\s/g, ''))}">${esc(s.phone)}</a>` : '')}
        ${row('🔬', s.researchgate ? `<a href="${esc(s.researchgate)}" rel="noopener" target="_blank">ResearchGate</a>` : '')}
        ${row('📚', s.scholar ? `<a href="${esc(s.scholar)}" rel="noopener" target="_blank">Google Scholar</a>` : '')}
      </ul></div>
    <div class="sp-main"><div class="sp-tabs" role="tablist">${TABS.map((t, k) => `<button type="button" role="tab" id="tab-${t[0]}" aria-controls="panel-${t[0]}" aria-selected="${k === 0}">${t[1]}</button>`).join('')}</div>
    ${TABS.map((t, k) => `<div class="sp-panel" role="tabpanel" id="panel-${t[0]}" aria-labelledby="tab-${t[0]}"${k ? ' hidden' : ''}>${panel(t[0])}</div>`).join('')}</div>
  </article>
  <nav class="sp-nav" aria-label="Profile navigation"><a href="staff-profile.html?id=${prev.id}">← <small>Previous</small> ${esc(prev.name === 'Name to be added' ? prev.title : prev.name)}</a><a href="staff-profile.html?id=${next.id}"><small>Next</small> ${esc(next.name === 'Name to be added' ? next.title : next.name)} →</a></nav>`;
  const tabBtns = [...box.querySelectorAll('.sp-tabs button')];
  const show = b => tabBtns.forEach(x => { const on = x === b; x.setAttribute('aria-selected', String(on)); x.tabIndex = on ? 0 : -1; document.getElementById(x.getAttribute('aria-controls')).hidden = !on; });
  tabBtns.forEach((b, k) => { b.addEventListener('click', () => show(b)); b.addEventListener('keydown', e => { const d = e.key === 'ArrowRight' ? 1 : e.key === 'ArrowLeft' ? -1 : 0; if (d) { const n = tabBtns[(k + d + tabBtns.length) % tabBtns.length]; n.focus(); show(n); } }); });
  show(tabBtns[0]);
}
</script>
<script src="assets/js/layout.js" defer></script>
</body>
</html>
