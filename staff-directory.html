<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Meet the management, academic and administrative staff of King Ceasor University.">
<meta name="theme-color" content="#062f1c">
<title>Staff Directory | King Ceasor University</title>
<link rel="stylesheet" href="assets/css/styles.css">
</head>
<body class="inner">
<div id="site-header"></div>
<main id="main">
<section class="page-hero has-img" style="--hero-img:url(../img/graduates-welcome-group.webp)"><div class="wrap"><p class="crumbs"><a href="index.html">Home</a> / <a href="about.html">About</a> / Staff directory</p><span class="eyebrow">King Ceasor University</span><h1>Staff Directory</h1><p>Meet the people who lead, teach and support learning at KCU.</p></div></section>
<section class="section"><div class="wrap">
<div class="sd-tools">
<div class="sd-filters" id="sd-filters" role="group" aria-label="Filter staff by category"></div>
<label class="sd-search"><span class="sr-only">Search staff</span><input id="sd-search" type="search" placeholder="Search by name or title" autocomplete="off"></label>
</div>
<div class="sd-grid" id="sd-grid" aria-live="polite"></div>
<p class="sd-empty" id="sd-empty" hidden>No staff match your search.</p>
</div></section>
</main>
<div id="site-footer"></div>
<script src="assets/js/staff-data.js"></script>
<script>
const grid = document.getElementById('sd-grid'), filters = document.getElementById('sd-filters'), search = document.getElementById('sd-search'), empty = document.getElementById('sd-empty');
let active = 'All';
['All', ...CATEGORIES].forEach(c => {
  const b = document.createElement('button'); b.type = 'button'; b.textContent = c; b.setAttribute('aria-pressed', String(c === active));
  b.addEventListener('click', () => { active = c; filters.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', String(x === b))); render(); });
  filters.appendChild(b);
});
function render() {
  const q = search.value.trim().toLowerCase();
  const list = STAFF.filter(s => (active === 'All' || s.category === active) && (!q || (s.name + ' ' + s.title).toLowerCase().includes(q)));
  grid.innerHTML = list.map(s => `<a class="sd-card" href="staff-profile.html?id=${s.id}"><div class="sd-photo">${s.photo ? `<img src="${esc(s.photo)}" alt="" loading="lazy">` : initials(s.name)}</div><div class="sd-info"><h3>${esc(s.name)}</h3><p>${esc(s.title)}</p><span class="sd-dept">${esc(s.category)}</span></div></a>`).join('');
  empty.hidden = list.length > 0;
}
search.addEventListener('input', render); render();
</script>
<script src="assets/js/layout.js" defer></script>
</body>
</html>
